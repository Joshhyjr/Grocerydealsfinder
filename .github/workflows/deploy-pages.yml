name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Configure the repository metadata expected by the Pages artifact and deployment actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # The current dependency tree contains peer ranges that npm resolves only in legacy mode.
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # Match Vite's production base path to this repository's GitHub Pages URL.
          GITHUB_PAGES: 'true'
          # Point the static frontend at the separately deployed Worker when the
          # repository variable is configured; otherwise estimate mode remains available.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
